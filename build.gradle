plugins {
  id 'java-library'
}

group = 'io.github.williamfiset'
version = '1.2'

repositories {
  mavenCentral()
}

dependencies {
  // FastJavaIO itself has no runtime dependencies; JUnit is only used by the tests.
  testImplementation 'junit:junit:4.13.2'
}

java {
  withSourcesJar()
  withJavadocJar()
}

// Compile against the Java 8 API so the jar runs on any judge or JVM from Java 8 onward.
tasks.withType(JavaCompile).configureEach {
  options.release = 8
  options.compilerArgs << '-Xlint:-options'
}

jar {
  archiveBaseName = 'fastjavaio'
}

test {
  dependsOn cleanTest
  testLogging.showStandardStreams = true
}

// Don't warn about undocumented members; still fail on malformed javadoc.
javadoc {
  options.addBooleanOption('Xdoclint:all,-missing', true)
}

// Builds the standalone fastjavaio.jar in the repo root (the file attached to GitHub Releases).
// Run with "./gradlew makeJar".
tasks.register('makeJar') {
  def builtJar = tasks.named('jar').flatMap { it.archiveFile }
  def rootJar = layout.projectDirectory.file('fastjavaio.jar')
  inputs.file(builtJar)
  outputs.file(rootJar)
  doLast {
    java.nio.file.Files.copy(builtJar.get().asFile.toPath(), rootJar.asFile.toPath(),
        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
  }
}
